# Production stack on the shared server maskly-prod (/opt/qualyx), next to maskly, Lecture Studio and CommMaster.
# The server's Caddy (maskly repo, infra/Caddyfile) routes qualyx.korayuysal.com to qualyx-web over the shared
# network infra_default. db and worker stay on this project's own network: other projects cannot reach them.
# Secrets: deploy/.env on the server (copy in 1Password: qualyx-prod-env), never in the repo.
name: qualyx

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qualyx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qualyx
    volumes: [db_data:/var/lib/postgresql/data]
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "qualyx"]
      interval: 5s
      retries: 20

  web:
    build: {context: .., dockerfile: deploy/Dockerfile.web}
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    env_file: .env  # optional integrations (Jira, Figma)
    environment: &app
      DATABASE_URL: postgres://qualyx:${POSTGRES_PASSWORD}@db:5432/qualyx
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://${DOMAIN}
      AUTH_TRUST_HOST: "true"
      APP_URL: https://${DOMAIN}
    networks: {default: {}, infra: {aliases: [qualyx-web]}}
    mem_limit: 768m
    memswap_limit: 768m

  # Runs the test jobs: Playwright browsers driven by the Claude CLI. Capped so it cannot starve the other apps.
  worker:
    build: {context: .., dockerfile: deploy/Dockerfile.worker}
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    env_file: .env  # CLAUDE_CODE_OAUTH_TOKEN logs the Claude CLI in
    environment: *app
    mem_limit: 3g
    memswap_limit: 3g
    cpus: "2.0"
    shm_size: 1g  # Chromium needs more than Docker's 64 MB default

  backup:  # nightly pg_dump, 14 days kept
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes: [backups:/backups]
    mem_limit: 256m
    entrypoint: ["sh", "-c", "while true; do d=$$(date +%F); pg_dump -h db -U qualyx -Fc qualyx > /backups/qualyx-$$d.dump || { echo BACKUP FAILED; exit 1; }; find /backups -name 'qualyx-*.dump' -mtime +14 -delete; echo backup ok $$d; sleep 86400; done"]

networks:
  infra:
    name: infra_default
    external: true

volumes:
  db_data:
  backups:
